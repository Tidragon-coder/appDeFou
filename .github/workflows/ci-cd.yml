name: CI

# Le déploiement (CD) est géré par l'intégration GitHub de Vercel :
# production à chaque push sur master, preview à chaque pull request.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Une seule exécution à la fois par branche : la plus récente annule les précédentes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CI : vérifie que le code passe le lint et compile
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
